name: Bump VibeZ to 1.3.0

on:
  push:
    branches: [v1.3.0-dev]
    paths:
      - '.github/workflows/bump-v1.3.0.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.3.0-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version 1.3.0 --no-git-tag-version
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Commit version metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Bump VibeZ to 1.3.0'
          git push origin HEAD:v1.3.0-dev
