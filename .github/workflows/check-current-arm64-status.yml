name: Check current ARM64 notarization status

on:
  push:
    branches:
      - notary-status-check-20260915
    paths:
      - .github/workflows/check-current-arm64-status.yml

permissions:
  contents: read

jobs:
  check-arm64:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SUBMISSION_ID: 068a8e60-1887-4617-857a-1b141a307f40
    steps:
      - name: Decode API key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          p.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          p.chmod(0o600)
          PY
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Check ARM64 notarization status
        shell: bash
        run: |
          xcrun notarytool info "$SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json

      - name: Fetch notarization log if finished
        shell: bash
        continue-on-error: true
        run: |
          STATUS="$(xcrun notarytool info "$SUBMISSION_ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')"
          echo "Status: $STATUS"
          if [ "$STATUS" != "In Progress" ]; then
            xcrun notarytool log "$SUBMISSION_ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          fi
