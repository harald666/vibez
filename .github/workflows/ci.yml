name: VibeZ CI

on:
  push:
    branches: [main, v1.3.2-dev, v1.4.0-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npm test

  package-linux-x64:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools xvfb
      - run: npm ci
      - name: Build x64 packages without publishing
        run: npx electron-builder --linux AppImage deb rpm pacman --x64 --publish never
      - name: Verify x64 package outputs
        run: |
          find dist -maxdepth 1 -type f -print
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.pacman' -o -name '*.pkg.tar.zst' \) -print -quit)"
      - name: Prepare Chromium sandbox for smoke test
        run: |
          SANDBOX="dist/linux-unpacked/chrome-sandbox"
          test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U:%G %a %n' "$SANDBOX"
      - name: Smoke test packaged app
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          APP="dist/linux-unpacked/vibez"
          test -x "$APP"
          EXPECTED="$(node -p "require('./package.json').version")"

          set +e
          ACTUAL="$(xvfb-run -a "$APP" --version 2>/tmp/vibez-version.log | tail -n 1)"
          version_code=$?
          set -e
          if [ "$version_code" -ne 0 ]; then
            cat /tmp/vibez-version.log
            echo "VibeZ --version failed during smoke test (code $version_code)." >&2
            exit 1
          fi
          test "$ACTUAL" = "$EXPECTED"

          set +e
          xvfb-run -a timeout 12s "$APP" --hidden > /tmp/vibez-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            cat /tmp/vibez-smoke.log
            echo "VibeZ exited unexpectedly during smoke test (code $code)." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.pkg.tar.zst
          if-no-files-found: error

  package-linux-arm64:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - name: Build ARM64 packages without publishing
        run: npx electron-builder --linux AppImage deb rpm pacman --arm64 --publish never
      - name: Verify ARM64 package outputs
        run: |
          find dist -maxdepth 1 -type f -print
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.pacman' -o -name '*.pkg.tar.zst' \) -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-linux-arm64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.pkg.tar.zst
          if-no-files-found: error

  flatpak-x64:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - run: npm ci
      - run: npm install --no-save @malept/flatpak-bundler@0.4.0
      - name: Build Flatpak bundle without publishing
        run: npx electron-builder --linux flatpak --x64 --publish never
      - name: Verify Flatpak output
        run: test -n "$(find dist -maxdepth 1 -type f -name '*.flatpak' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-flatpak-x64
          path: dist/*.flatpak
          if-no-files-found: error

  package-windows-x64:
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows x64 installer without publishing
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify Windows x64 installer and packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*Windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows x64 NSIS installer was not created.' }
          $app = 'dist\win-unpacked\vibez.exe'
          if (-not (Test-Path $app)) { throw 'Windows x64 packaged executable was not created.' }
          $expected = (node -p "require('./package.json').version").Trim()
          $actual = (& $app --version | Select-Object -Last 1).Trim()
          if ($actual -ne $expected) { throw "Unexpected VibeZ version: $actual (expected $expected)" }
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-windows-x64
          path: |
            dist/*Windows-x64.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  package-windows-arm64:
    needs: test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows ARM64 installer without publishing
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --arm64 --publish never
      - name: Verify Windows ARM64 installer and packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*Windows-arm64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows ARM64 NSIS installer was not created.' }
          $app = 'dist\win-arm64-unpacked\vibez.exe'
          if (-not (Test-Path $app)) { $app = 'dist\win-unpacked\vibez.exe' }
          if (-not (Test-Path $app)) { throw 'Windows ARM64 packaged executable was not created.' }
          $expected = (node -p "require('./package.json').version").Trim()
          $actual = (& $app --version | Select-Object -Last 1).Trim()
          if ($actual -ne $expected) { throw "Unexpected VibeZ version: $actual (expected $expected)" }
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-windows-arm64
          path: |
            dist/*Windows-arm64.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  package-macos-intel:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build macOS Intel packages without publishing or signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --x64 --publish never
      - name: Verify macOS Intel packages and packaged app
        shell: bash
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-x64.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-x64.zip' -print -quit)"
          APP="$(find dist/mac -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"
          test -n "$APP"
          EXPECTED="$(node -p "require('./package.json').version")"
          ACTUAL="$("$APP" --version | tail -n 1)"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-macos-intel
          path: |
            dist/*macOS-x64.dmg
            dist/*macOS-x64.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

  package-macos-arm64:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build macOS Apple Silicon packages without publishing or signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Verify macOS Apple Silicon packages and packaged app
        shell: bash
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-arm64.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*macOS-arm64.zip' -print -quit)"
          APP="$(find dist/mac-arm64 -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"
          if [ -z "$APP" ]; then APP="$(find dist/mac -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"; fi
          test -n "$APP"
          EXPECTED="$(node -p "require('./package.json').version")"
          ACTUAL="$("$APP" --version | tail -n 1)"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-macos-arm64
          path: |
            dist/*macOS-arm64.dmg
            dist/*macOS-arm64.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error
