name: VibeZ Cross-Platform Smoke

on:
  push:
    branches: [main, v1.4.0-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-launch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unpacked Windows x64 app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --dir
      - name: Launch smoke test
        shell: pwsh
        run: |
          $app = 'dist\win-unpacked\vibez.exe'
          if (-not (Test-Path $app)) { throw 'Packaged Windows x64 app missing.' }
          $proc = Start-Process -FilePath $app -ArgumentList '--hidden' -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "VibeZ exited during Windows launch smoke test with code $($proc.ExitCode)." }
          Stop-Process -Id $proc.Id -Force

  windows-arm64-launch:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unpacked Windows ARM64 app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --arm64 --dir
      - name: Launch smoke test
        shell: pwsh
        run: |
          $app = 'dist\win-arm64-unpacked\vibez.exe'
          if (-not (Test-Path $app)) { $app = 'dist\win-unpacked\vibez.exe' }
          if (-not (Test-Path $app)) { throw 'Packaged Windows ARM64 app missing.' }
          $proc = Start-Process -FilePath $app -ArgumentList '--hidden' -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "VibeZ exited during Windows ARM64 launch smoke test with code $($proc.ExitCode)." }
          Stop-Process -Id $proc.Id -Force

  macos-intel-launch:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unpacked macOS Intel app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --x64 --dir
      - name: Launch smoke test
        shell: bash
        run: |
          APP="$(find dist/mac -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"
          test -n "$APP"
          "$APP" --hidden > /tmp/vibez-smoke.log 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/vibez-smoke.log
            echo 'VibeZ exited during macOS Intel launch smoke test.' >&2
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" || true

  macos-arm64-launch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unpacked macOS Apple Silicon app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --dir
      - name: Launch smoke test
        shell: bash
        run: |
          APP="$(find dist/mac-arm64 -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"
          if [ -z "$APP" ]; then APP="$(find dist/mac -path '*/Contents/MacOS/*' -type f -perm +111 -print -quit)"; fi
          test -n "$APP"
          "$APP" --hidden > /tmp/vibez-smoke.log 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/vibez-smoke.log
            echo 'VibeZ exited during macOS Apple Silicon launch smoke test.' >&2
            exit 1
          fi
          kill "$pid" || true
          wait "$pid" || true
