name: Fix VibeZ 1.3.2 Screenshot layer

on:
  push:
    branches: [v1.3.2-dev]
    paths:
      - '.github/workflows/fix-screenshot-layer-v1.3.2.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.3.2-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Screenshot hotfix
        run: python3 .github/scripts/fix-screenshot-layer-v1.3.2.py
      - name: Set version 1.3.2
        run: npm version 1.3.2 --no-git-tag-version
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Screenshot account-button overlap and layering'
          git push origin HEAD:v1.3.2-dev

# Retry after separating CI workflow changes from the hotfix commit.
