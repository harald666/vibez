name: VibeZ macOS Notarization Status

on:
  workflow_dispatch:
    inputs:
      intel_submission_id:
        description: Intel notarization submission ID
        required: true
        default: '5c8e0dfc-6d5a-4af1-b197-7047bd4da4c7'
      arm64_submission_id:
        description: Apple Silicon notarization submission ID
        required: true
        default: 'b635b884-f9cb-442a-a878-05d75f3a75e4'

permissions:
  contents: read

jobs:
  check-status:
    name: Check Apple notarization status
    runs-on: macos-15
    timeout-minutes: 10
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      INTEL_SUBMISSION_ID: ${{ inputs.intel_submission_id }}
      ARM64_SUBMISSION_ID: ${{ inputs.arm64_submission_id }}
    steps:
      - name: Verify Apple API secrets
        shell: bash
        run: |
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

      - name: Decode App Store Connect API key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          p.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          p.chmod(0o600)
          PY
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Check Intel submission
        id: intel
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool info "$INTEL_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json | tee "$RUNNER_TEMP/intel.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'intel.json')
          d=json.load(open(p))
          status=d.get('status','Unknown')
          print(f"Intel status: {status}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"status={status}\n")
          PY

      - name: Check Apple Silicon submission
        id: arm64
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool info "$ARM64_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json | tee "$RUNNER_TEMP/arm64.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'arm64.json')
          d=json.load(open(p))
          status=d.get('status','Unknown')
          print(f"Apple Silicon status: {status}")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"status={status}\n")
          PY

      - name: Add status summary
        shell: bash
        env:
          INTEL_STATUS: ${{ steps.intel.outputs.status }}
          ARM64_STATUS: ${{ steps.arm64.outputs.status }}
        run: |
          {
            echo '## Apple notarization status'
            echo
            echo '| Build | Submission ID | Status |'
            echo '|---|---|---|'
            echo "| Intel | \`$INTEL_SUBMISSION_ID\` | **$INTEL_STATUS** |"
            echo "| Apple Silicon | \`$ARM64_SUBMISSION_ID\` | **$ARM64_STATUS** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch Intel notarization log when finished
        if: steps.intel.outputs.status != 'In Progress'
        continue-on-error: true
        shell: bash
        run: |
          xcrun notarytool log "$INTEL_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"

      - name: Fetch Apple Silicon notarization log when finished
        if: steps.arm64.outputs.status != 'In Progress'
        continue-on-error: true
        shell: bash
        run: |
          xcrun notarytool log "$ARM64_SUBMISSION_ID" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"
