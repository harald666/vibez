name: Prepare VibeZ 1.3.1

on:
  push:
    branches: [v1.3.1-dev]
    paths:
      - '.github/workflows/prepare-release-v1.3.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.3.1-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final source, test and documentation changes
        run: python3 .github/scripts/prepare-release-v1.3.1.py
      - name: Set release version
        run: npm version 1.3.1 --no-git-tag-version
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Run full tests
        run: npm test
      - name: Verify language and version metadata
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='1.3.1') throw new Error('wrong version')"
          node -e "const {LANGUAGE_OPTIONS,TRANSLATIONS}=require('./i18n'); const n=LANGUAGE_OPTIONS.filter(x=>x.code!=='system').length; if(n!==34||Object.keys(TRANSLATIONS).length!==34) throw new Error('expected 34 complete languages')"
      - name: Remove temporary development helpers
        run: |
          git rm -f .github/workflows/fix-screenshot-position-v1.3.1.yml
          git rm -f .github/workflows/wire-i18n-v1.3.1.yml
          git rm -f .github/scripts/wire-i18n-v1.3.1.js
          git rm -f .github/scripts/prepare-release-v1.3.1.py
          git rm -f .github/workflows/prepare-release-v1.3.1.yml
      - name: Commit release candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare VibeZ 1.3.1 release'
          git push origin HEAD:v1.3.1-dev
