name: Refine VibeZ 1.4.1

on:
  push:
    branches: [v1.4.1-dev]
    paths:
      - '.github/workflows/refine-v1.4.1.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.4.1-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply maintenance refinements
        run: python3 .github/scripts/refine-v1.4.1.py
      - name: Set version 1.4.1
        run: npm version 1.4.1 --no-git-tag-version
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Commit refinements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js screenshot.js settings.html package.json package-lock.json README.md CHANGELOG.md test ui-detection.js
          git commit -m 'Refine VibeZ 1.4.1 maintenance quality'
          git push origin HEAD:v1.4.1-dev
