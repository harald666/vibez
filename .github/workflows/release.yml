name: Release VibeZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vibez-release
  cancel-in-progress: false

jobs:
  release-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes from changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then printf 'See CHANGELOG.md for details.\n' > release-notes.md; fi

      - name: Check whether release already exists
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} already exists; skipping package rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux packaging dependencies
        if: steps.release.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools flatpak flatpak-builder xvfb
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Install dependencies
        if: steps.release.outputs.exists == 'false'
        run: |
          npm ci
          npm install --no-save @malept/flatpak-bundler@0.4.0

      - name: Security audit
        if: steps.release.outputs.exists == 'false'
        run: npm audit --audit-level=high

      - name: Run tests
        if: steps.release.outputs.exists == 'false'
        run: npm test

      - name: Build x64 Linux packages
        if: steps.release.outputs.exists == 'false'
        run: npx electron-builder --linux AppImage deb rpm pacman --x64 --publish never

      - name: Prepare Chromium sandbox for smoke test
        if: steps.release.outputs.exists == 'false'
        run: |
          SANDBOX="dist/linux-unpacked/chrome-sandbox"
          test -f "$SANDBOX"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          stat -c '%U:%G %a %n' "$SANDBOX"

      - name: Smoke test packaged x64 app
        if: steps.release.outputs.exists == 'false'
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          APP="dist/linux-unpacked/vibez"
          test -x "$APP"
          EXPECTED="$(node -p "require('./package.json').version")"

          set +e
          ACTUAL="$(xvfb-run -a "$APP" --version 2>/tmp/vibez-version.log | tail -n 1)"
          version_code=$?
          set -e
          if [ "$version_code" -ne 0 ]; then
            cat /tmp/vibez-version.log
            echo "VibeZ --version failed during release smoke test (code $version_code)." >&2
            exit 1
          fi
          test "$ACTUAL" = "$EXPECTED"

          set +e
          xvfb-run -a timeout 12s "$APP" --hidden > /tmp/vibez-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            cat /tmp/vibez-smoke.log
            echo "VibeZ exited unexpectedly during release smoke test (code $code)." >&2
            exit 1
          fi

      - name: Build ARM64 Linux packages
        if: steps.release.outputs.exists == 'false'
        run: npx electron-builder --linux AppImage deb rpm pacman --arm64 --publish never

      - name: Build x64 Flatpak bundle
        if: steps.release.outputs.exists == 'false'
        run: npx electron-builder --linux flatpak --x64 --publish never

      - name: Generate SHA-256 checksums
        if: steps.release.outputs.exists == 'false'
        shell: bash
        run: |
          cd dist
          : > SHA256SUMS
          for file in *.AppImage *.deb *.rpm *.pacman *.pkg.tar.zst *.flatpak; do
            [ -f "$file" ] || continue
            sha256sum "$file" >> SHA256SUMS
          done
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release and upload assets
        if: steps.release.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.pacman' -o -name '*.pkg.tar.zst' -o -name '*.flatpak' -o \
            -name 'latest*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS' \
          \) -print | sort)
          test "${#assets[@]}" -gt 0
          gh release create "v${VERSION}" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${VERSION}" \
            --notes-file release-notes.md

      - name: Update existing GitHub Release notes
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v${VERSION}" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY"
