name: Upgrade VibeZ 1.3.0 dependencies

on:
  push:
    branches: [v1.3.0-dev]
    paths:
      - '.github/workflows/upgrade-deps-v1.3.0.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Electron and electron-builder
        run: npm install --save-dev electron@43.6.0 electron-builder@26.15.3
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Run VibeZ tests
        run: npm test
      - name: Commit refreshed dependency lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Upgrade Electron build dependencies for VibeZ 1.3.0'
          git push origin HEAD:v1.3.0-dev
