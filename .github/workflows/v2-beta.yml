name: VibeZ 2.0 Beta Test

on:
  push:
    branches: [v2.0-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibez-v2-beta
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npm test

  linux-appimage:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh root lock metadata for beta version
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build isolated VibeZ 2.0 Linux AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Verify beta package version
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          APP="dist/linux-unpacked/vibez"
          test -x "$APP"
          test "$("$APP" --version | tail -n 1)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-Linux-x64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
