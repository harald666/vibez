name: VibeZ 2 macOS Intel DMG Continuation

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0-dev
    paths:
      - .github/workflows/v2-macos-intel-dmg-continuation.yml

permissions:
  contents: read
  actions: read

jobs:
  intel-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 350
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Download successful stapled Intel app artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-Intel-STAPLED-APP
          path: dist
          repository: lecomputeur/vibez
          run-id: 34912329988
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode App Store Connect API key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          p.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          p.chmod(0o600)
          PY

      - name: Restore and verify stapled Intel app
        shell: bash
        run: |
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-x64.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p work/app
          ditto -x -k "$ZIP" work/app
          APP="$(find work/app -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Create Intel DMG
        shell: bash
        run: |
          APP="$(find work/app -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="dist/VibeZ-2-Beta-2.0.0-beta.1-macOS-x64.dmg"
          hdiutil create -volname "VibeZ 2 Beta" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Submit Intel DMG and resiliently wait for Apple
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-x64.dmg' -print -quit)"
          test -n "$DMG"

          response=""
          rc=1
          for attempt in $(seq 1 10); do
            set +e
            response="$(xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            echo "$response"
            [ "$rc" -eq 0 ] && break
            echo "Submit attempt $attempt failed; retrying in 30 seconds..."
            sleep 30
          done
          [ "$rc" -eq 0 ]
          ID="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "Submission ID: $ID"

          deadline=$(( $(date +%s) + 19800 ))
          status="Unknown"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            info="$(xcrun notarytool info "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "Temporary Apple/network status error; retrying in 30 seconds..."
              echo "$info"
              sleep 30
              continue
            fi
            status="$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')"
            echo "Notarization $ID: $status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
                exit 1
                ;;
              *) sleep 30 ;;
            esac
          done
          [ "$status" = "Accepted" ]

      - name: Staple and validate Intel DMG
        shell: bash
        run: |
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-x64.dmg' -print -quit)"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload final Intel signed and notarized files
        uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-Intel-SIGNED-NOTARIZED
          path: |
            dist/*macOS-x64.zip
            dist/*macOS-x64.dmg
          if-no-files-found: error
