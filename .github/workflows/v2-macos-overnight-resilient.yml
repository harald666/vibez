name: VibeZ 2 macOS Overnight Resilient

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0-dev
    paths:
      - .github/workflows/v2-macos-overnight-resilient.yml

permissions:
  contents: read

concurrency:
  group: vibez-v2-macos-overnight-resilient
  cancel-in-progress: false

jobs:
  app:
    name: app-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            outdir: dist/mac
            label: intel
            pretty: Intel
          - arch: arm64
            runner: macos-15
            outdir: dist/mac-arm64
            label: arm64
            pretty: Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "$MAC_CERTIFICATE_P12_BASE64"
          test -n "$MAC_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"

      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Decode Apple signing material
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'vibez-developer-id.p12').write_bytes(base64.b64decode(os.environ['MAC_CERTIFICATE_P12_BASE64']))
          (temp / 'AuthKey.p8').write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          PY
          chmod 600 "$RUNNER_TEMP/vibez-developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and sign app
        env:
          CSC_LINK: ${{ runner.temp }}/vibez-developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.build.mac.notarize = false;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never

      - name: Verify Developer ID signature
        shell: bash
        run: |
          APP="$(find '${{ matrix.outdir }}' -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='

      - name: Submit app and resiliently wait for Apple
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ matrix.arch }}.zip' -print -quit)"
          test -n "$ZIP"

          submit_file() {
            local target="$1"
            local response rc id
            for attempt in $(seq 1 10); do
              set +e
              response="$(xcrun notarytool submit "$target" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
              rc=$?
              set -e
              echo "$response"
              if [ "$rc" -eq 0 ]; then
                id="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
                echo "$id"
                return 0
              fi
              echo "Submit attempt $attempt failed; retrying in 30 seconds..."
              sleep 30
            done
            return 1
          }

          wait_for_notary() {
            local id="$1"
            local deadline info rc status
            deadline=$(( $(date +%s) + 19800 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              set +e
              info="$(xcrun notarytool info "$id" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
              rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                echo "Temporary Apple/network status error; retrying in 30 seconds..."
                echo "$info"
                sleep 30
                continue
              fi
              status="$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')"
              echo "Notarization $id: $status"
              case "$status" in
                Accepted) return 0 ;;
                Invalid|Rejected)
                  xcrun notarytool log "$id" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
                  return 1
                  ;;
                *) sleep 30 ;;
              esac
            done
            echo "Notarization still not complete after 330 minutes."
            return 124
          }

          SUBMISSION_ID="$(submit_file "$ZIP" | tee /dev/stderr | tail -n 1)"
          echo "Submission ID: $SUBMISSION_ID"
          wait_for_notary "$SUBMISSION_ID"

      - name: Staple and verify app
        shell: bash
        run: |
          APP="$(find '${{ matrix.outdir }}' -maxdepth 1 -type d -name '*.app' -print -quit)"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Recreate stapled ZIP
        shell: bash
        run: |
          APP="$(find '${{ matrix.outdir }}' -maxdepth 1 -type d -name '*.app' -print -quit)"
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ matrix.arch }}.zip' -print -quit)"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

      - name: Upload stapled app
        uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-${{ matrix.pretty }}-STAPLED-APP
          path: dist/*macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  dmg:
    name: dmg-${{ matrix.label }}
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            label: intel
            pretty: Intel
          - arch: arm64
            runner: macos-15
            label: arm64
            pretty: Apple-Silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Download stapled app
        uses: actions/download-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-${{ matrix.pretty }}-STAPLED-APP
          path: dist

      - name: Decode App Store Connect API key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          p.write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          p.chmod(0o600)
          PY

      - name: Restore stapled app and create DMG
        shell: bash
        run: |
          ZIP="$(find dist -maxdepth 1 -type f -name '*macOS-${{ matrix.arch }}.zip' -print -quit)"
          test -n "$ZIP"
          mkdir -p work/app
          ditto -x -k "$ZIP" work/app
          APP="$(find work/app -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          DMG="dist/VibeZ-2-Beta-2.0.0-beta.1-macOS-${{ matrix.arch }}.dmg"
          hdiutil create -volname "VibeZ 2 Beta" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Submit DMG and resiliently wait for Apple
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-${{ matrix.arch }}.dmg' -print -quit)"
          test -n "$DMG"

          response=""
          for attempt in $(seq 1 10); do
            set +e
            response="$(xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            echo "$response"
            [ "$rc" -eq 0 ] && break
            echo "Submit attempt $attempt failed; retrying in 30 seconds..."
            sleep 30
          done
          [ "$rc" -eq 0 ]
          ID="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "Submission ID: $ID"

          deadline=$(( $(date +%s) + 19800 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            info="$(xcrun notarytool info "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "Temporary Apple/network status error; retrying in 30 seconds..."
              echo "$info"
              sleep 30
              continue
            fi
            status="$(printf '%s' "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')"
            echo "Notarization $ID: $status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$ID" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
                exit 1
                ;;
              *) sleep 30 ;;
            esac
          done
          [ "$status" = "Accepted" ]

      - name: Staple and validate DMG
        shell: bash
        run: |
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-${{ matrix.arch }}.dmg' -print -quit)"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload final signed and notarized files
        uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-${{ matrix.pretty }}-SIGNED-NOTARIZED
          path: |
            dist/*macOS-${{ matrix.arch }}.zip
            dist/*macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
