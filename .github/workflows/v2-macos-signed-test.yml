            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 20m

      - name: Staple and verify Apple Silicon app
        shell: bash
        run: |
          APP="$(find dist/mac-arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Recreate Apple Silicon ZIP with stapled app
        shell: bash
        run: |
