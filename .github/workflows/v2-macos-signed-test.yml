          hdiutil create -volname "VibeZ 2 Beta" -srcfolder "$APP" -ov -format UDZO "$DMG"

      - name: Submit Apple Silicon DMG to Apple notarization
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        shell: bash
        run: |
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-arm64.dmg' -print -quit)"
          test -n "$DMG"
          echo "Submitting Apple Silicon DMG to Apple: $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
