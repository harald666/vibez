name: VibeZ 2 macOS Signed Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibez-v2-macos-signed-test
  cancel-in-progress: false

jobs:
  macos-intel:
    runs-on: macos-15-intel
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify signing secrets are configured
        shell: bash
        run: |
          test -n "$MAC_CERTIFICATE_P12_BASE64"
          test -n "$MAC_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"
      - name: Refresh beta lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Decode Apple signing material
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'vibez-developer-id.p12').write_bytes(base64.b64decode(os.environ['MAC_CERTIFICATE_P12_BASE64']))
          (temp / 'AuthKey.p8').write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          PY
      - name: Build signed and notarized macOS Intel beta
        env:
          CSC_LINK: ${{ runner.temp }}/vibez-developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        run: npx electron-builder --mac dmg zip --x64 --publish never
      - name: Verify Developer ID signature and Gatekeeper assessment
        shell: bash
        run: |
          APP="$(find dist/mac -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='
          spctl --assess --type execute --verbose=4 "$APP"
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-x64.dmg' -print -quit)"
          test -n "$DMG"
          xcrun stapler validate "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-Intel-SIGNED-NOTARIZED
          path: |
            dist/*macOS-x64.dmg
            dist/*macOS-x64.zip
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    env:
      MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify signing secrets are configured
        shell: bash
        run: |
          test -n "$MAC_CERTIFICATE_P12_BASE64"
          test -n "$MAC_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_TEAM_ID"
      - name: Refresh beta lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Decode Apple signing material
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'vibez-developer-id.p12').write_bytes(base64.b64decode(os.environ['MAC_CERTIFICATE_P12_BASE64']))
          (temp / 'AuthKey.p8').write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_P8_BASE64']))
          PY
      - name: Build signed and notarized macOS Apple Silicon beta
        env:
          CSC_LINK: ${{ runner.temp }}/vibez-developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Verify Developer ID signature and Gatekeeper assessment
        shell: bash
        run: |
          APP="$(find dist/mac-arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then APP="$(find dist/mac -maxdepth 1 -type d -name '*.app' -print -quit)"; fi
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier='
          spctl --assess --type execute --verbose=4 "$APP"
          DMG="$(find dist -maxdepth 1 -type f -name '*macOS-arm64.dmg' -print -quit)"
          test -n "$DMG"
          xcrun stapler validate "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-macOS-Apple-Silicon-SIGNED-NOTARIZED
          path: |
            dist/*macOS-arm64.dmg
            dist/*macOS-arm64.zip
          if-no-files-found: error
