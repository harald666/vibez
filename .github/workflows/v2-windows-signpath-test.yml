name: VibeZ 2 Windows SignPath Test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vibez-v2-windows-signpath-test
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify SignPath configuration
        shell: pwsh
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) { throw 'SIGNPATH_API_TOKEN secret is not configured.' }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { throw 'SIGNPATH_ORGANIZATION_ID variable is not configured.' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { throw 'SIGNPATH_PROJECT_SLUG variable is not configured.' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { throw 'SIGNPATH_SIGNING_POLICY_SLUG variable is not configured.' }
      - name: Refresh beta lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build unsigned Windows x64 beta installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Locate unsigned installer
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*Windows-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Unsigned Windows x64 installer missing.' }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-Windows-x64-unsigned-for-signpath
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
      - name: Submit x64 installer to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Verify signed x64 installer
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -File -Filter '*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'Signed x64 installer was not returned by SignPath.' }
          $signature = Get-AuthenticodeSignature $signed.FullName
          $signature | Format-List Status,StatusMessage,@{Name='Signer';Expression={$_.SignerCertificate.Subject}}
          if ($signature.Status -ne 'Valid') { throw "Authenticode signature is not valid: $($signature.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-Windows-x64-SIGNED
          path: signed/**/*.exe
          if-no-files-found: error

  windows-arm64:
    runs-on: windows-11-arm
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify SignPath configuration
        shell: pwsh
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) { throw 'SIGNPATH_API_TOKEN secret is not configured.' }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { throw 'SIGNPATH_ORGANIZATION_ID variable is not configured.' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { throw 'SIGNPATH_PROJECT_SLUG variable is not configured.' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { throw 'SIGNPATH_SIGNING_POLICY_SLUG variable is not configured.' }
      - name: Refresh beta lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Build unsigned Windows ARM64 beta installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --arm64 --publish never
      - name: Locate unsigned installer
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -File -Filter '*Windows-arm64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Unsigned Windows ARM64 installer missing.' }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer for SignPath origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-Windows-arm64-unsigned-for-signpath
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
      - name: Submit ARM64 installer to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Verify signed ARM64 installer
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -File -Filter '*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'Signed ARM64 installer was not returned by SignPath.' }
          $signature = Get-AuthenticodeSignature $signed.FullName
          $signature | Format-List Status,StatusMessage,@{Name='Signer';Expression={$_.SignerCertificate.Subject}}
          if ($signature.Status -ne 'Valid') { throw "Authenticode signature is not valid: $($signature.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: VibeZ-2.0.0-beta.1-Windows-arm64-SIGNED
          path: signed/**/*.exe
          if-no-files-found: error
