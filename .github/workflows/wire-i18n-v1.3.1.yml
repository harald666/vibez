name: Wire VibeZ 1.3.1 i18n

on:
  push:
    branches: [v1.3.1-dev]
    paths:
      - '.github/workflows/wire-i18n-v1.3.1.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.3.1-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adapt patch to current code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/wire-i18n-v1.3.1.js')
          s=p.read_text()
          s=s.replace("'    const width = 146;\\n    const height = 48;'", "'  const width = 146;\\n  const height = 48;'")
          s=s.replace("'    const buttonBounds = screenshotButtonWindow.getBounds();\\n    const width = Math.max(146, buttonBounds.width || 146);\\n    const height = 48;'", "'  const buttonBounds = screenshotButtonWindow.getBounds();\\n  const width = Math.max(146, buttonBounds.width || 146);\\n  const height = 48;'")
          s=s.replace("shell.openExternal(\\`${REPO_URL}/issues/new\\`);", "shell.openExternal(\\`\\${REPO_URL}/issues/new\\`);")
          p.write_text(s)
          PY
      - name: Apply i18n wiring
        run: node .github/scripts/wire-i18n-v1.3.1.js
      - run: npm test
      - name: Commit i18n wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js screenshot.js
          git commit -m 'Use OS locale across all VibeZ-owned UI'
          git push origin HEAD:v1.3.1-dev
