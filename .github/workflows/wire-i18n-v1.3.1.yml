name: Wire VibeZ 1.3.1 i18n

on:
  push:
    branches: [v1.3.1-dev]
    paths:
      - '.github/workflows/wire-i18n-v1.3.1.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1.3.1-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire central translations into main process and screenshots
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function exact(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`Patch target not found: ${label}`);
            return source.replace(from, to);
          }
          function regex(source, pattern, to, label) {
            if (!pattern.test(source)) throw new Error(`Patch regex not found: ${label}`);
            pattern.lastIndex = 0;
            return source.replace(pattern, to);
          }

          let main = fs.readFileSync('main.js', 'utf8');
          main = exact(main,
            "const { createSettingsStore } = require('./settings-store');",
            "const { createSettingsStore } = require('./settings-store');\nconst { resolveLanguage, t, uiBundle } = require('./i18n');",
            'main i18n import');
          main = main.replace("let browserLanguage = 'en';\n", '');
          main = regex(main,
            /const uiTranslations = \{[\s\S]*?\n\};\n\nfunction selectedLanguage\(\) \{[\s\S]*?\n\}\n\nfunction uiText\(\) \{[\s\S]*?\n\}/,
            `function selectedLanguage() {
  const osLocale = app.isReady()
    ? app.getLocale()
    : (process.env.LC_ALL || process.env.LC_MESSAGES || process.env.LANG || 'en');
  return resolveLanguage(settings.language, osLocale);
}

function currentUiBundle() {
  return uiBundle(selectedLanguage());
}

function uiText() {
  return currentUiBundle().strings;
}`,
            'legacy translations');
          main = exact(main,
            '    const width = 146;\n    const height = 48;',
            '    const buttonBounds = screenshotButtonWindow.getBounds();\n    const width = Math.max(146, buttonBounds.width || 146);\n    const height = 48;',
            'dynamic screenshot width');
          main = exact(main,
            'async function triggerScreenshot() {',
            `async function syncNativeScreenshotButtonText() {
  if (!screenshotButtonWindow || screenshotButtonWindow.isDestroyed()) return;
  const ui = currentUiBundle();
  const shortcut = String(settings.screenshotShortcut || '').replace('CommandOrControl', 'Ctrl');
  try {
    const desiredWidth = await screenshotButtonWindow.webContents.executeJavaScript(\`
      window.__vibezSetUi?.(\${JSON.stringify({ language: ui.language, dir: ui.dir, label: ui.strings.screenshot, shortcut })}) || 146
    \`);
    const bounds = screenshotButtonWindow.getBounds();
    const width = Math.max(146, Math.min(228, Number(desiredWidth) || 146));
    if (bounds.width !== width) screenshotButtonWindow.setBounds({ ...bounds, width }, false);
    await positionScreenshotButton();
  } catch (error) {
    console.error('Could not localize Screenshot button:', error);
  }
}

async function triggerScreenshot() {`,
            'native screenshot localizer');
          main = exact(main,
            "    await showMessageBox({\n      type: 'error',\n      title: 'VibeZ Screenshot',\n      message: 'Could not start the screenshot tool.',\n      detail: error.message,\n    });",
            "    const text = uiText();\n    await showMessageBox({\n      type: 'error',\n      title: `VibeZ · ${text.screenshot}`,\n      message: text.shotStartError,\n      detail: error.message,\n    });",
            'screenshot error dialog');
          main = exact(main,
            "  screenshotButtonWindow.loadFile(path.join(__dirname, 'screenshot-button.html')).then(() => {\n    screenshotButtonNativeReady = true;\n    suppressInjectedScreenshotButton();\n    refreshScreenshotButtonVisibility();",
            "  screenshotButtonWindow.loadFile(path.join(__dirname, 'screenshot-button.html')).then(async () => {\n    screenshotButtonNativeReady = true;\n    await syncNativeScreenshotButtonText();\n    suppressInjectedScreenshotButton();\n    refreshScreenshotButtonVisibility();",
            'native button load');
          main = exact(main, 'text.google', 'text.searchGoogle', 'google menu key');
          main = exact(main, 'text.duckDuckGo', 'text.searchDuck', 'duck menu key');
          main = regex(main,
            /function updateBrowserLanguage\(win\) \{[\s\S]*?\n\}/,
            `function updateBrowserLanguage(win) {
  if (!win || win.isDestroyed()) return;
  rebuildTray();
  buildApplicationMenu();
  syncNativeScreenshotButtonText();
}`,
            'browser language override');
          main = exact(main, '  setupScreenshot(mainWindow);', '  setupScreenshot(mainWindow, selectedLanguage);', 'screenshot language getter');
          main = exact(main,
            "    { label: 'Edit', submenu: [{ role: 'undo' }, { role: 'redo' }, { type: 'separator' }, { role: 'cut' }, { role: 'copy' }, { role: 'paste' }, { role: 'selectAll' }] },\n    { label: 'View', submenu: [{ role: 'reload' }, { role: 'toggleDevTools' }, { type: 'separator' }, { role: 'resetZoom' }, { role: 'zoomIn' }, { role: 'zoomOut' }, { type: 'separator' }, { role: 'togglefullscreen' }] },",
            "    { role: 'editMenu' },\n    { role: 'viewMenu' },",
            'localized native menus');
          main = exact(main, "      'Comment=Mistral Vibe desktop client',", "      `Comment=${uiText().desktopClient}`,", 'autostart comment');
          main = regex(main,
            /async function showAbout\(\) \{[\s\S]*?\n\}\n\nfunction openSettings\(\)/,
            `async function showAbout() {
  const text = uiText();
  const result = await showMessageBox({
    type: 'info',
    title: \`${'${text.about}'} · \${windowTitle()}\`,
    message: windowTitle(),
    detail: \`${'${text.desktopClient}'}\\n\\n\${systemInfoText()}\`,
    buttons: [text.copySystem, 'GitHub', text.reportProblem, text.close],
    defaultId: 3,
    cancelId: 3,
  });
  if (result.response === 0) clipboard.writeText(systemInfoText());
  if (result.response === 1) shell.openExternal(REPO_URL);
  if (result.response === 2) shell.openExternal(\`${REPO_URL}/issues/new\`);
  return true;
}

function openSettings()`,
            'about dialog');
          main = exact(main, "    title: 'VibeZ Settings',", "    title: uiText().settingsTitle,", 'settings window title');
          main = exact(main,
            "    return settings;",
            "    return { settings, ui: currentUiBundle() };",
            'settings get ui');
          main = exact(main,
            "    refreshScreenshotButtonVisibility();\n    suppressInjectedScreenshotButton();\n    rebuildTray();\n    buildApplicationMenu();\n    return { settings, restartRequired, shortcutRegistered, autostartApplied };",
            "    refreshScreenshotButtonVisibility();\n    suppressInjectedScreenshotButton();\n    rebuildTray();\n    buildApplicationMenu();\n    await syncNativeScreenshotButtonText();\n    return { settings, ui: currentUiBundle(), restartRequired, shortcutRegistered, autostartApplied };",
            'settings save ui');
          main = regex(main,
            /function installUpdaterHandlers\(\) \{[\s\S]*?\n\}\n\nfunction checkForUpdates\(manual = false\) \{[\s\S]*?\n\}/,
            `function installUpdaterHandlers() {
  if (updaterHandlersInstalled) return;
  updaterHandlersInstalled = true;
  autoUpdater.autoDownload = true;
  autoUpdater.autoInstallOnAppQuit = Boolean(settings.installUpdatesOnQuit);

  autoUpdater.on('update-available', (info) => console.log(\`VibeZ update available: \${info.version}\`));
  autoUpdater.on('update-not-available', () => {
    if (!manualUpdateCheck) return;
    manualUpdateCheck = false;
    const text = uiText();
    showMessageBox({ type: 'info', title: \`VibeZ · \${text.updates}\`, message: text.latest });
  });
  autoUpdater.on('error', (error) => {
    console.error('VibeZ updater error:', error);
    if (!manualUpdateCheck) return;
    manualUpdateCheck = false;
    const text = uiText();
    showMessageBox({ type: 'error', title: \`VibeZ · \${text.updates}\`, message: text.updateFailed, detail: error.message });
  });
  autoUpdater.on('update-downloaded', async (info) => {
    manualUpdateCheck = false;
    const text = uiText();
    const result = await showMessageBox({
      type: 'info',
      title: text.updateReady,
      message: t(selectedLanguage(), 'readyInstall', { version: info.version }),
      buttons: [text.restartUpdate, text.later],
      defaultId: 0,
      cancelId: 1,
    });
    if (result.response === 0) {
      isQuitting = true;
      autoUpdater.quitAndInstall(false, true);
    }
  });
}

function checkForUpdates(manual = false) {
  manualUpdateCheck = Boolean(manual);
  const text = uiText();
  if (!app.isPackaged) {
    if (manual) showMessageBox({ type: 'info', title: \`VibeZ · \${text.updates}\`, message: text.installedOnly });
    return;
  }
  if (process.env.FLATPAK_ID) {
    if (manual) showMessageBox({ type: 'info', title: \`VibeZ · \${text.updates}\`, message: text.flatpakBuild, buttons: [text.openReleases, text.close], defaultId: 0 }).then((result) => { if (result.response === 0) shell.openExternal(RELEASES_URL); });
    return;
  }
  installUpdaterHandlers();
  autoUpdater.checkForUpdates().catch((error) => console.error('Update check failed:', error));
}`,
            'updater dialogs');
          fs.writeFileSync('main.js', main);

          let shot = fs.readFileSync('screenshot.js', 'utf8');
          shot = exact(shot,
            "const path = require('path');",
            "const path = require('path');\nconst { t, uiBundle } = require('./i18n');",
            'screenshot i18n import');
          shot = regex(shot,
            /const screenshotTranslations = \{[\s\S]*?async function getPageLanguage\(\) \{[\s\S]*?\n\}/,
            `let languageGetter = () => 'en';

function currentLanguage() {
  try { return languageGetter() || 'en'; } catch (_) { return 'en'; }
}

function screenshotText(language) {
  return {
    label: t(language, 'screenshot'),
    noSource: t(language, 'noSource'),
    noDisplays: t(language, 'noDisplays'),
    failedTitle: t(language, 'shotFailed'),
    failedMessage: t(language, 'shotFailedMessage'),
    selectionTitle: t(language, 'selectShot'),
    selectionHint: t(language, 'selectHint'),
  };
}`,
            'legacy screenshot translations');
          shot = regex(shot,
            /        const locale = String\(navigator\.language[\s\S]*?        const screenshotLabel = labels\[locale\] \|\| labels\.en;/,
            "        const screenshotLabel = ${JSON.stringify(t(currentLanguage(), 'screenshot'))};",
            'injected button label');
          shot = exact(shot, '    language = await getPageLanguage();', '    language = currentLanguage();', 'screenshot OS language');
          shot = exact(shot,
            "  await overlay.loadFile(path.join(__dirname, 'screenshot-overlay.html'));\n  await overlay.webContents.executeJavaScript(`\n    window.__vibezSetScreenshotLanguage?.(${JSON.stringify(language)});\n    window.__vibezSetScreenshot(${JSON.stringify(image.toDataURL())});\n  `);",
            "  await overlay.loadFile(path.join(__dirname, 'screenshot-overlay.html'));\n  const ui = uiBundle(language);\n  await overlay.webContents.executeJavaScript(`\n    window.__vibezSetScreenshotText?.(${JSON.stringify({ language: ui.language, dir: ui.dir, title: t(language, 'selectShot'), hint: t(language, 'selectHint') })});\n    window.__vibezSetScreenshot(${JSON.stringify(image.toDataURL())});\n  `);",
            'screenshot overlay text');
          shot = exact(shot,
            'function setupScreenshot(win) {\n  mainWindow = win;',
            "function setupScreenshot(win, getLanguage) {\n  mainWindow = win;\n  if (typeof getLanguage === 'function') languageGetter = getLanguage;",
            'screenshot getter setup');
          fs.writeFileSync('screenshot.js', shot);
          NODE
      - run: npm test
      - name: Commit i18n wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js screenshot.js
          git commit -m 'Use OS locale across all VibeZ-owned UI'
          git push origin HEAD:v1.3.1-dev
