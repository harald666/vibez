<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
    body{display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{
      width:138px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:0 13px 0 10px;
      border-radius:11px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(31,32,36,.94);
      color:rgba(255,255,255,.94);
      font:600 13px/1 inherit;
      letter-spacing:.01em;
      cursor:pointer;
      box-shadow:0 5px 18px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      -webkit-app-region:no-drag;
      transition:background .15s ease,border-color .15s ease,transform .12s ease,box-shadow .15s ease;
    }
    .icon{
      width:24px;
      height:24px;
      display:grid;
      place-items:center;
      flex:0 0 24px;
      border-radius:7px;
      background:rgba(255,138,61,.14);
      color:#ff8a3d;
    }
    .icon svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    button:hover{
      background:rgba(43,44,49,.98);
      border-color:rgba(255,255,255,.18);
      box-shadow:0 7px 22px rgba(0,0,0,.31),inset 0 1px 0 rgba(255,255,255,.05);
      transform:translateY(-1px);
    }
    button:active{transform:translateY(0) scale(.985)}
    button:focus-visible{outline:2px solid rgba(255,138,61,.9);outline-offset:1px}
  </style>
</head>
<body>
  <button id="capture" type="button" title="Screenshot (Ctrl+Shift+S)" aria-label="Screenshot">
    <span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M7.5 7.5 9 5.5h6l1.5 2H19a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2h2.5Z"/>
        <circle cx="12" cy="13" r="3.25"/>
      </svg>
    </span>
    <span>Screenshot</span>
  </button>
  <script>
    document.getElementById('capture').addEventListener('click', () => {
      window.vibez?.captureScreenshot();
    });
  </script>
</body>
</html>
